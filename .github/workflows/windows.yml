name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: 'Windows runner image'
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-2025
      toolset:
        description: 'Compiler toolset'
        type: choice
        default: MSVC
        options:
          - MSVC
          - ClangCL
      configuration:
        description: 'Build configuration'
        type: choice
        default: Release
        options:
          - Debug
          - Release

jobs:
  msbuild:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.os) || '["windows-2022", "windows-2025"]') }}
        toolset: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.toolset) || '["ClangCL", "MSVC"]') }}
        configuration: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.configuration) || '["Debug", "Release"]') }}
    steps:
    - uses: actions/checkout@v6
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Set toolset
      if: matrix.toolset == 'ClangCL'
      run: echo "toolset=/p:PlatformToolset=${{ matrix.toolset }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Build Osiris.dll
      shell: cmd
      run: msbuild Osiris.sln /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} ${{ env.toolset }}
    - name: Generate embedded DLL header
      shell: pwsh
      run: powershell -NoProfile -ExecutionPolicy Bypass -File Injector\generate_embedded.ps1 -Configuration ${{ matrix.configuration }}
    - name: Build Injector.exe (embedded DLL)
      shell: cmd
      run: msbuild Injector\Injector.vcxproj /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} ${{ env.toolset }}
    - name: Stage artifacts (flat, no folders in the zip)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging | Out-Null
        Copy-Item "x64\${{ matrix.configuration }}\Osiris.dll" -Destination staging
        Copy-Item "Injector\x64\${{ matrix.configuration }}\Injector.exe" -Destination staging
    - name: Upload artifacts (DLL + injector)
      uses: actions/upload-artifact@v5
      with:
        name: Osiris-${{ matrix.configuration }}-${{ matrix.toolset }}-${{ matrix.os }}
        path: staging/*
        if-no-files-found: error

  cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.os) || '["windows-2022", "windows-2025"]') }}
        toolset: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.toolset) || '["ClangCL", "MSVC"]') }}
        configuration: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.configuration) || '["Debug", "Release"]') }}
    steps:
    - uses: actions/checkout@v6
    - name: Set toolset
      if: matrix.toolset == 'ClangCL'
      run: echo "toolset=-T ${{ matrix.toolset }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: configure
      run: cmake -Werror=dev -D ENABLE_TESTS="unit;functional" -D CMAKE_COMPILE_WARNING_AS_ERROR=1 -A x64 ${{ env.toolset }} -B build
    - name: build source
      run: cmake --build build --target Osiris --config ${{ matrix.configuration }}
    - name: build unit tests
      run: cmake --build build --target UnitTests --config ${{ matrix.configuration }}
    - name: build functional tests
      run: cmake --build build --target FunctionalTests --config ${{ matrix.configuration }}
    - name: run unit tests
      run: ctest -R ^Unit --test-dir build -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --schedule-random -j $env:NUMBER_OF_PROCESSORS
    - name: run functional tests
      run: ctest -R ^Functional --test-dir build -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --schedule-random -j $env:NUMBER_OF_PROCESSORS
